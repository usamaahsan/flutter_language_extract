name: language_extract
description: >-
  CLI tool that scans Flutter projects for hardcoded strings and generates
  localization files for GetX, easy_localization, and intl. Supports
  --replace to rewrite source files with .tr calls automatically.
version: 1.0.0
repository: https://github.com/usamaahsan/flutter_language_extract
issue_tracker: https://github.com/usamaahsan/flutter_language_extract/issues
topics:
  - flutter
  - localization
  - i18n
  - getx
  - cli

environment:
  sdk: ^3.0.0

# Add regular dependencies here.
dependencies:
  path: ^1.9.0
  analyzer: ^12.0.0
  args: ^2.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
